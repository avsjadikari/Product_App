{% extends "base.html" %}

{% block title %}404 - Page Not Found | Product App{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-75">
        <div class="col-md-8 col-lg-6 text-center">
            <div class="card border-0 shadow-lg" style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);">
                <div class="card-body py-5">
                    <div class="mb-4">
                        <i class="bi bi-search text-secondary" style="font-size: 5rem;"></i>
                    </div>
                    <h1 class="display-1 fw-bold text-secondary mb-3">404</h1>
                    <h3 class="text-dark mb-3">Page Not Found</h3>
                    <p class="text-secondary mb-4 lead">
                        The page you're looking for doesn't exist or has been moved.
                    </p>
                    <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                        <a href="/" class="btn btn-primary btn-lg">
                            <i class="bi bi-house-door me-2"></i>
                            Go to Dashboard
                        </a>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg">
                            <i class="bi bi-arrow-left me-2"></i>
                            Go Back
                        </a>
                    </div>
                </div>
            </div>

            <div class="mt-4 p-4 bg-white rounded-3 shadow-sm">
                <h5 class="text-secondary mb-3">Quick Links</h5>
                <div class="d-flex flex-wrap justify-content-center gap-2">
                    <a href="/customers" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-people me-1"></i> Customers
                    </a>
                    <a href="/products" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-box me-1"></i> Products
                    </a>
                    <a href="/invoices" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-receipt me-1"></i> Invoices
                    </a>
                    <a href="/cart" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-cart3 me-1"></i> Cart
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.min-vh-75 {
    min-height: 75vh;
}
</style>
{% endblock %}
