{% extends "base.html" %}
{% block content %}
<div class="card mb-3">
    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Customers</h4>
    </div>
    <div class="card-body">
        {% if customers %}
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Address</th>
                    </tr>
                </thead>
                <tbody>
                {% for c in customers %}
                    <tr>
                        <td>{{ c.first_name }} {{ c.last_name }}</td>
                        <td>{{ c.phone_number }}</td>
                        <td>{{ c.customer_address }}</td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
            <p class="text-muted">No customers yet.</p>
        {% endif %}

        <hr class="my-3">

        <h5>Add Customer</h5>
        <form method="post" action="/customers/add">
            <div class="row g-2">
                <div class="col-6">
                    <input name="first_name" class="form-control" placeholder="First Name" required>
                </div>
                <div class="col-6">
                    <input name="last_name" class="form-control" placeholder="Last Name" required>
                </div>
                <div class="col-6">
                    <input name="phone_number" class="form-control" placeholder="Phone" required>
                </div>
                <div class="col-6">
                    <input name="customer_address" class="form-control" placeholder="Address" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary w-100">Add Customer</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
