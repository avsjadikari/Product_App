{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">Edit Product</h1>
    <p class="page-subtitle">Update product details</p>
</div>

<div class="row">
    <div class="col-12 col-lg-6">
        <div class="card">
            <div class="card-header d-flex align-items-center">
                <i class="bi bi-pencil-square text-success me-2"></i>
                Product Details
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Product Type</label>
                        <input name="product_type" class="form-control" value="{{ product.product_type }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Product Name</label>
                        <input name="product_name" class="form-control" value="{{ product.product_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Model</label>
                        <input name="product_model" class="form-control" value="{{ product.product_model }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Color</label>
                        <input name="product_color" class="form-control" value="{{ product.product_color }}" required>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label small text-secondary">Price (LKR)</label>
                            <input name="product_price" class="form-control" type="number" step="0.01" value="{{ product.product_price }}" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label small text-secondary">Quantity</label>
                            <input name="product_quantity" class="form-control" type="number" min="0" value="{{ product.product_quantity }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Low Stock Threshold</label>
                        <input name="low_stock_threshold" class="form-control" type="number" min="0" value="{{ product.low_stock_threshold }}">
                        <small class="text-muted">Alert when stock falls below this number</small>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg me-1"></i>Save Changes
                        </button>
                        <a href="/products" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg me-1"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
