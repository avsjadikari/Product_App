{% extends "base.html" %}
{% block content %}
<div class="card">
    <div class="card-header bg-success text-white">
        <h4 class="mb-0">Edit Product</h4>
    </div>
    <div class="card-body">
        <form method="post" class="row g-3">
            <div class="col-md-2">
                <label class="form-label">Type</label>
                <input name="product_type" class="form-control" value="{{ product.product_type }}" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">Name</label>
                <input name="product_name" class="form-control" value="{{ product.product_name }}" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">Model</label>
                <input name="product_model" class="form-control" value="{{ product.product_model }}" required>
            </div>
            <div class="col-md-1">
                <label class="form-label">Color</label>
                <input name="product_color" class="form-control" value="{{ product.product_color }}" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">Price</label>
                <input name="product_price" class="form-control" type="number" step="0.01" value="{{ product.product_price }}" required>
            </div>
            <div class="col-md-1">
                <label class="form-label">Quantity</label>
                <input name="product_quantity" class="form-control" type="number" min="0" value="{{ product.product_quantity }}" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">&nbsp;</label>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Save</button>
                    <a href="/products" class="btn btn-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
