{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">Edit Customer</h1>
    <p class="page-subtitle">Update customer information</p>
</div>

<div class="row">
    <div class="col-12 col-md-6">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-person-edit me-2"></i>
                Customer Details
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input name="first_name" class="form-control" value="{{ customer.first_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input name="last_name" class="form-control" value="{{ customer.last_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input name="phone_number" class="form-control" value="{{ customer.phone_number }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input name="email" type="email" class="form-control" value="{{ customer.email or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input name="customer_address" class="form-control" value="{{ customer.customer_address }}" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i> Save Changes
                        </button>
                        <a href="{{ url_for('customers') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
