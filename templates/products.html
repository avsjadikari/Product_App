{% extends "base.html" %}
{% block content %}
<h2>Products</h2>
<ul>
{% for p in products %}
  <li>{{ p.product_name }} ({{ p.product_type }}) - {{ p.product_color }} - ${{ "%.2f"|format(p.product_price) }}</li>
{% endfor %}
</ul>

<form method="post" action="/products/add">
    <input name="product_type" placeholder="Type" required>
    <input name="product_name" placeholder="Name" required>
    <input name="product_color" placeholder="Color" required>
    <input name="product_price" placeholder="Price" type="number" step="0.01" required>
    <button type="submit">Add Product</button>
</form>
{% endblock %}
